name: quran_app_2025
description: "A beautiful Quran app with complete features"

publish_to: "none"

version: 1.8.1+15

environment:
  sdk: ">=3.9.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.5.0
  just_audio: ^0.10.5
  shared_preferences: ^2.2.2
  url_launcher: ^6.1.11
  flutter_native_splash: ^2.4.4
  geolocator: ^14.0.1
  flutter_compass: ^0.8.1
  scrollable_positioned_list: ^0.3.8
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  in_app_update: ^5.0.0
  audio_service: 0.18.19
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  google_sign_in: ^7.2.0
  path_provider: ^2.1.5
  record: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  crypto: ^3.0.7
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/icon.png"
  min_sdk_android: 21
  adaptive_icon_foreground: "assets/icons/icon_foreground.png"
  adaptive_icon_background: "#2E7D32"
  web:
    generate: true
    image_path: "assets/icons/icon.png"
    background_color: "#2E7D32"

flutter_native_splash:
  color: "#2E7D32"
  image: assets/icons/splash_icon.png
  branding: assets/icons/branding.png
  branding_mode: bottom
  branding_bottom_padding: 24
  color_dark: "#1B5E20"
  image_dark: assets/icons/splash_icon.png
  branding_dark: assets/icons/branding.png
  android_12:
    image: assets/icons/splash_icon.png
    color: "#2E7D32"
    icon_background_color: "#2E7D32"
    image_dark: assets/icons/splash_icon.png
    color_dark: "#1B5E20"
    icon_background_color_dark: "#1B5E20"
  android: true
  ios: true
  web: true

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/quran/raw/tanzil_uthmani_v1.0.2.txt
    - assets/quran/raw/tajweed_cpfair_tanzil_v1.0.2.json
    - assets/quran/raw/quran-data.xml
    - assets/quran/raw/tanzil_id.indonesian_2010-06-04.txt
    # Materi tajwid ditulis manusia dan diisi di luar kode; lihat
    # docs/TAJWEED_CONTENT.md.
    - assets/learn/tajweed_lessons.json
    - assets/learn/tajweed_explanations.json
    - assets/learn/curriculum.json

  fonts:
    # Teks Al-Qur'an. Amiri Quran dan Amiri sama-sama mencakup seluruh 68
    # karakter dataset Tanzil (diuji di test/font_coverage_test.dart).
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
    # Font variabel, dipangkas ke Latin agar hemat ruang (1,74 MB -> 0,7 MB).
    # Ketebalan diatur lewat fontVariations pada SacredTokens.
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-wght-Latin.ttf
    - family: EBGaramond
      fonts:
        - asset: assets/fonts/EBGaramond-wght-Latin.ttf
        - asset: assets/fonts/EBGaramond-Italic-wght-Latin.ttf
          style: italic
  #   - family: ScheherazadeNew
  #     fonts:
  #       - asset: assets/fonts/ScheherazadeNew-Regular.ttf
  #       - asset: assets/fonts/ScheherazadeNew-Bold.ttf
  #         weight: 700
